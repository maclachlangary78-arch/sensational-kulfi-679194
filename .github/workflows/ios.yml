name: iOS starter workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Set Default Scheme
        working-directory: ios/App
        run: |
          set -euo pipefail
          scheme_list=$(xcodebuild -project App.xcodeproj -list -json | tr -d "\n")
          default=$(echo "$scheme_list" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["project"]["targets"][0]')
          echo "$default" > default
          echo "Using default scheme: $default"

      - name: Build
        working-directory: ios/App
        env:
          scheme: default
          platform: iOS Simulator
        run: |
          set -euo pipefail
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone[^()]*' | head -1 | sed 's/[[:space:]]*$//; s/[[:space:]] Simulator$//')
          test -n "$device"
          if [ "$scheme" = default ]; then scheme=$(cat default); fi
          xcodebuild build-for-testing \
            -project App.xcodeproj \
            -scheme "$scheme" \
            -destination "platform=$platform,name=$device"

      - name: Test
        working-directory: ios/App
        env:
          scheme: default
          platform: iOS Simulator
        run: |
          set -euo pipefail
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone[^()]*' | head -1 | sed 's/[[:space:]]*$//; s/[[:space:]] Simulator$//')
          test -n "$device"
          if [ "$scheme" = default ]; then scheme=$(cat default); fi
          xcodebuild test-without-building \
            -project App.xcodeproj \
            -scheme "$scheme" \
            -destination "platform=$platform,name=$device"
