name: iOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build and test on an iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Set Default Scheme
        working-directory: ios/App
        run: |
          set -euo pipefail
          scheme_list=$(xcodebuild -project App.xcodeproj -list -json | tr -d "\n")
          default=$(echo "$scheme_list" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["project"]["targets"][0]')
          echo "$default" > default
          echo "Using default scheme: $default"

      - name: Build
        working-directory: ios/App
        env:
          scheme: default
          platform: iOS Simulator
        run: |
          set -euo pipefail
          if [ "$scheme" = default ]; then scheme=$(cat default); fi
          device_id=$(xcodebuild -project App.xcodeproj -scheme "$scheme" -showdestinations 2>/dev/null | sed -n 's/.*platform:iOS Simulator,.*id:\([^,]*\),.*name:iPhone[^,}]*.*/\1/p' | head -1)
          if [ -z "$device_id" ]; then
            echo "No iPhone simulator destination was found for scheme $scheme."
            xcodebuild -project App.xcodeproj -scheme "$scheme" -showdestinations
            exit 1
          fi
          echo "Using simulator destination id: $device_id"
          xcodebuild build-for-testing \
            -project App.xcodeproj \
            -scheme "$scheme" \
            -destination "platform=$platform,id=$device_id"

      - name: Test
        working-directory: ios/App
        env:
          scheme: default
          platform: iOS Simulator
        run: |
          set -euo pipefail
          if [ "$scheme" = default ]; then scheme=$(cat default); fi
          if ! grep -Eq 'productType = "com\.apple\.product-type\.bundle\.(unit-test|ui-testing)"' App.xcodeproj/project.pbxproj; then
            echo "No XCTest targets are configured; skipping simulator tests."
            exit 0
          fi
          device_id=$(xcodebuild -project App.xcodeproj -scheme "$scheme" -showdestinations 2>/dev/null | sed -n 's/.*platform:iOS Simulator,.*id:\([^,]*\),.*name:iPhone[^,}]*.*/\1/p' | head -1)
          if [ -z "$device_id" ]; then
            echo "No iPhone simulator destination was found for scheme $scheme."
            xcodebuild -project App.xcodeproj -scheme "$scheme" -showdestinations
            exit 1
          fi
          echo "Using simulator destination id: $device_id"
          test_log="$RUNNER_TEMP/xcodebuild-test.log"
          if xcodebuild test-without-building \
            -project App.xcodeproj \
            -scheme "$scheme" \
            -destination "platform=$platform,id=$device_id" >"$test_log" 2>&1; then
            cat "$test_log"
          elif grep -Fq "Scheme $scheme is not currently configured for the test-without-building action." "$test_log"; then
            cat "$test_log"
            echo "::notice::Scheme $scheme has no test action configured; skipping tests."
          else
            cat "$test_log"
            exit 1
          fi

      - name: Archive App
        working-directory: ios/App
        env:
          scheme: default
          configuration: Release
        run: |
          set -euo pipefail
          if [ "$scheme" = default ]; then scheme=$(cat default); fi

          archive_path="$RUNNER_TEMP/App.xcarchive"
          echo "Creating archive for scheme: $scheme"
          xcodebuild \
            -project App.xcodeproj \
            -scheme "$scheme" \
            -configuration "$configuration" \
            -sdk iphoneos \
            -archivePath "$archive_path" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ${{ runner.temp }}/App.xcarchive
