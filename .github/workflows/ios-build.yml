name: iOS build and test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build and test default scheme on an iPhone simulator
        working-directory: ios/App
        run: |
          set -euo pipefail

          DESTINATION="$(xcodebuild -workspace App.xcworkspace -scheme App -showdestinations 2>/dev/null \
            | sed -n 's/.*platform:iOS Simulator,.*name:\([^,]*\).*/\1/p' \
            | head -n 1)"

          if [ -z "$DESTINATION" ]; then
            echo "No iPhone simulator was found."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator: $DESTINATION"

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -destination "platform=iOS Simulator,name=$DESTINATION" \
            -configuration Debug \
            -derivedDataPath build \
            build test

      - name: Save build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifacts
          path: ios/App/build/
