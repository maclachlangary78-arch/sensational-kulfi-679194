name: iOS Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: macos-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Set up code signing
        run: |
          # Create a keychain
          security create-keychain -p "" build.keychain
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          
          # Import certificate
          echo "${{ secrets.CERTIFICATE_DATA }}" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "${{ secrets.CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          
          # Import provisioning profile
          echo "${{ secrets.PROVISIONING_PROFILE_DATA }}" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Verify signing setup
        run: |
          security find-identity -v -p codesigning build.keychain
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"
          while IFS= read -r profile; do
            profile_plist="$RUNNER_TEMP/profile.plist"
            security cms -D -i "$profile" > "$profile_plist"
            profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist" 2>/dev/null || echo "UNKNOWN")
            app_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist" 2>/dev/null || echo "UNKNOWN")
            echo "Profile: $profile"
            echo "  Name: $profile_name"
            echo "  application-identifier: $app_identifier"
          done < <(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name '*.mobileprovision' -print)

      - name: Set build number
        working-directory: ios/App
        run: |
          xcrun agvtool new-version -all "${GITHUB_RUN_NUMBER}"

      - name: Build and archive iOS app
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/LureRater.xcarchive" \
            -allowProvisioningUpdates \
            archive

      - name: Inject team ID into export options
        run: |
          cp ios/App/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID ${{ secrets.APPLE_TEAM_ID }}" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/LureRater.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates

      - name: Set up App Store Connect API key
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          if printf '%s' "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" | grep -q '\\n'; then
            printf '%b' "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > "$key_path"
          else
            printf '%s' "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > "$key_path"
          fi
          chmod 600 "$key_path"

      - name: Upload IPA to App Store Connect
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found in $RUNNER_TEMP/export"
            find "$RUNNER_TEMP/export" -maxdepth 2 -type f || true
            echo "Distribution logs (if any):"
            find "$RUNNER_TEMP" -maxdepth 3 -name '*.xcdistributionlogs' -print || true
            exit 1
          fi

          echo "Uploading IPA: $IPA_PATH"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Clean up
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f certificate.p12 profile.mobileprovision "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

      - name: Save build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifacts
          path: |
            ${{ runner.temp }}/LureRater.xcarchive
            ${{ runner.temp }}/export/
