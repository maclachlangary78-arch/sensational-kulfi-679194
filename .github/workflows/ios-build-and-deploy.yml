name: iOS Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: macos-latest
    
    steps:
      - name: Verify required secrets are configured
        env:
          CERTIFICATE_DATA: ${{ secrets.CERTIFICATE_DATA }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_DATA: ${{ secrets.PROVISIONING_PROFILE_DATA }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CERTIFICATE_DATA CERTIFICATE_PASSWORD PROVISIONING_PROFILE_DATA \
            APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Set up code signing
        env:
          CERTIFICATE_DATA: ${{ secrets.CERTIFICATE_DATA }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_DATA: ${{ secrets.PROVISIONING_PROFILE_DATA }}
        run: |
          set -euo pipefail

          decode_base64_secret() {
            local name="$1" value="$2" output="$3" encoded
            encoded="$(printf '%s' "$value" | tr -d '[:space:]')"
            case $((${#encoded} % 4)) in
              1) echo "::error::$name is not valid base64."; return 1 ;;
              2) encoded="${encoded}==" ;;
              3) encoded="${encoded}=" ;;
            esac
            if ! printf '%s' "$encoded" | base64 --decode > "$output" 2>/dev/null; then
              rm -f "$output"
              echo "::error::$name must contain base64-encoded file contents."
              return 1
            fi
            if [ ! -s "$output" ]; then
              echo "::error::$name decoded to an empty file."
              return 1
            fi
            echo "Decoded $name -> $output ($(wc -c < "$output" | tr -d ' ') bytes)"
          }

          decode_base64_secret CERTIFICATE_DATA "$CERTIFICATE_DATA" "$RUNNER_TEMP/certificate.p12"
          decode_base64_secret PROVISIONING_PROFILE_DATA "$PROVISIONING_PROFILE_DATA" "$RUNNER_TEMP/profile.mobileprovision"

          # Type sanity checks: a .p12 is DER (starts 0x30); a profile is a CMS blob containing a plist
          if [ "$(head -c1 "$RUNNER_TEMP/certificate.p12" | xxd -p)" != "30" ]; then
            echo "::error::CERTIFICATE_DATA does not look like a .p12 file (did you base64 the right file?)."
            exit 1
          fi
          if ! security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist" 2>/dev/null; then
            echo "::error::PROVISIONING_PROFILE_DATA is not a valid .mobileprovision file."
            exit 1
          fi

          echo "Creating temporary keychain build.keychain"
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security default-keychain -s build.keychain

          echo "Importing certificate"
          if ! security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security; then
            echo "::error::Certificate import failed. Check CERTIFICATE_PASSWORD and that CERTIFICATE_DATA is a .p12 exported with its private key."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain >/dev/null

          echo "Installing provisioning profile"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          echo "Installed profile UUID $profile_uuid"

      - name: Verify signing setup
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Code signing identities:"
          security find-identity -v -p codesigning build.keychain | tee "$RUNNER_TEMP/identities.txt"
          if grep -q ' 0 valid identities found' "$RUNNER_TEMP/identities.txt"; then
            echo "::error::No valid code signing identities in the keychain. Export the certificate with its private key as .p12."
            exit 1
          fi
          echo "Installed provisioning profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"
          while IFS= read -r profile; do
            profile_plist="$RUNNER_TEMP/verify-profile.plist"
            security cms -D -i "$profile" > "$profile_plist"
            echo "Profile: $profile"
            echo "  Name: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist" 2>/dev/null || echo UNKNOWN)"
            echo "  application-identifier: $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist" 2>/dev/null || echo UNKNOWN)"
            profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist" 2>/dev/null || echo UNKNOWN)"
            echo "  Team: $profile_team"
            if [ "$profile_team" != "$APPLE_TEAM_ID" ]; then
              echo "::warning::Profile team $profile_team does not match APPLE_TEAM_ID."
            fi
          done < <(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name '*.mobileprovision' -print)

      - name: Set up App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          raw_key="$APP_STORE_CONNECT_PRIVATE_KEY"
          if printf '%s' "$raw_key" | grep -q 'BEGIN PRIVATE KEY'; then
            # literal PEM, or PEM with escaped "\n" sequences
            if printf '%s' "$raw_key" | grep -q '\\n'; then
              printf '%b\n' "$raw_key" > "$key_path"
            else
              printf '%s\n' "$raw_key" > "$key_path"
            fi
          else
            encoded="$(printf '%s' "$raw_key" | tr -d '[:space:]')"
            if ! printf '%s' "$encoded" | base64 --decode > "$key_path" 2>/dev/null; then
              echo "::error::APP_STORE_CONNECT_PRIVATE_KEY is neither PEM text nor base64-encoded PEM."
              exit 1
            fi
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$key_path" || ! grep -q "END PRIVATE KEY" "$key_path"; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY did not produce a valid PEM (.p8) private key."
            exit 1
          fi
          chmod 600 "$key_path"
          echo "App Store Connect key written to $key_path"

      - name: Set build number
        working-directory: ios/App
        run: |
          if grep -q "CURRENT_PROJECT_VERSION =" App.xcodeproj/project.pbxproj; then
            xcrun agvtool new-version -all "${GITHUB_RUN_NUMBER}"
          else
            echo "::warning::CURRENT_PROJECT_VERSION is not configured for agvtool; using xcodebuild override for this run."
          fi

      - name: Build and archive iOS app
        working-directory: ios/App
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ ! -d App.xcodeproj ]; then
            echo "::error::ios/App/App.xcodeproj not found."
            exit 1
          fi
          xcodebuild -project App.xcodeproj -list
          if ! xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/LureRater.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1; then
            echo "::error::xcodebuild archive failed. Last 80 log lines:"
            tail -n 80 "$RUNNER_TEMP/archive.log"
            exit 1
          fi
          tail -n 5 "$RUNNER_TEMP/archive.log"

      - name: Inject team ID into export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cp ios/App/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          if grep -q '__APPLE_TEAM_ID__' "$RUNNER_TEMP/ExportOptions.plist"; then
            echo "::error::Team ID placeholder was not replaced."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :teamID" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          if ! xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/LureRater.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1; then
            echo "::error::xcodebuild -exportArchive failed. Last 80 log lines:"
            tail -n 80 "$RUNNER_TEMP/export.log"
            exit 1
          fi
          tail -n 5 "$RUNNER_TEMP/export.log"

      - name: Upload IPA to App Store Connect
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mapfile -t IPA_FILES < <(find "$RUNNER_TEMP/export" -maxdepth 1 -type f -name '*.ipa' -print)
          if [ "${#IPA_FILES[@]}" -eq 0 ]; then
            echo "No IPA found in $RUNNER_TEMP/export"
            find "$RUNNER_TEMP/export" -maxdepth 2 -type f || true
            echo "Distribution logs (if any):"
            find "$RUNNER_TEMP" -maxdepth 3 -name '*.xcdistributionlogs' -print || true
            exit 1
          fi
          if [ "${#IPA_FILES[@]}" -gt 1 ]; then
            echo "Expected exactly one IPA in $RUNNER_TEMP/export, found ${#IPA_FILES[@]}"
            printf '%s\n' "${IPA_FILES[@]}"
            exit 1
          fi
          IPA_PATH="${IPA_FILES[0]}"

          echo "Uploading IPA: $IPA_PATH"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Restore Xcode project versioning changes
        if: always()
        run: |
          git checkout -- ios/App/App.xcodeproj/project.pbxproj || true

      - name: Clean up
        if: always()
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          security delete-keychain build.keychain || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/verify-profile.plist"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Save build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifacts
          path: |
            ${{ runner.temp }}/LureRater.xcarchive
            ${{ runner.temp }}/export/
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/*.xcdistributionlogs
          if-no-files-found: ignore
